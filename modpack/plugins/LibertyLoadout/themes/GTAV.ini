; GTA V - a Liberty Loadout theme. Select with "Theme GTAV".
;
; Translucent grey wedges, gaps instead of seams, blue wash on the cursor
; wedge, blue arc on the equipped wedge, no hub pointer, fist at six o'clock,
; coloured weapon icons. Not a replica.
;
; Full key list, ranges and allowed values: README.txt in this folder.
; Keys omitted here fall back to Liberty's values. Copy this file under a new
; name and point Theme at the copy to keep your version safe from an update.
;
; First knobs:
;   WedgeOpacity           how much of the scene comes through the ring
;   TintAlpha              how dark the rest of the screen goes
;   WeaponAccentRed/...    the selection colour
;   HighlightOpacityInner  raise to 1.00 for a flat selected fill

; --- Ring ---
WeaponWheelScale 1.00
RadioWheelScale  1.00
CenterTextScale 1.50
WeaponUnarmedPosition Bottom

WedgeRed   74
WedgeGreen 74
WedgeBlue  74
WedgeOpacity 0.30
WedgeGradient 0.00

SeamAlpha 0
RimAlpha  0

WedgeOutlineRed   26
WedgeOutlineGreen 28
WedgeOutlineBlue  32
WedgeOutlineOuterAlpha 102
WedgeOutlineInnerAlpha 0
WedgeOutlineSideAlpha  0
WedgeOutlineWidth      2.5
WedgeOutlineUsesAccent FALSE

WheelSegmentGap 0.50
WheelShadowAlpha 0

; Pinned against the shipped defaults rather than inherited. Liberty's ring is
; nine detached tiles with cut corners, an outer accent track and tracked
; micro-labels; GTA V's is a continuous donut with square wedges and none of
; that, so every key that moved with Liberty is restated here at the value this
; theme has always drawn. Keys a theme omits follow the defaults, so leaving
; these out would quietly modernise this file too.
WheelOuterRadius 174
WheelInnerRadius 110
WeaponIconSize   26
WedgeCornerRadius 0
OuterTrackWidth 0
PointerUsesAccent FALSE
HubEyebrowTracking 0
HubRuleAlpha 0
AmmoClipScale 1.00
StatBarSegments 0
StatLabelTracking 0
ParachuteBadgeRimAlpha 0

; --- Selection ---
WeaponAccentRed   126
WeaponAccentGreen 168
WeaponAccentBlue  216
WeaponAccentTladRed    200
WeaponAccentTladGreen  52
WeaponAccentTladBlue   44
WeaponAccentTbogtRed   229
WeaponAccentTbogtGreen 57
WeaponAccentTbogtBlue  155
EpisodicWeaponAccent TRUE

RadioAccentRed    126
RadioAccentGreen  168
RadioAccentBlue   216
RadioAccentTladRed    200
RadioAccentTladGreen  52
RadioAccentTladBlue   44
RadioAccentTbogtRed   229
RadioAccentTbogtGreen 57
RadioAccentTbogtBlue  155
EpisodicRadioAccent TRUE

HighlightAccentMix      1.00
HighlightAccentMixInner 1.00
WeaponHighlightGlowAlpha 0
RadioHighlightGlowAlpha  0
HighlightOpacity        1.00
HighlightOpacityInner   0.22
HighlightLiftInner 0
HighlightLiftOuter 0
HighlightOutlineAlpha 0
HighlightStripeWidth 0

; --- Equipped ---
CurrentMarkWidth 4
CurrentMarkPosition Outer
CurrentMarkUsesAccent TRUE
CurrentMarkOnHighlight TRUE
CurrentGlowAlpha 0

; --- Icons ---
; HD | Color | Original | OriginalUpscaled
WeaponIcons Color
ParachuteBadgeRadius 25
ParachuteBadgeGap 12
ParachuteBadgeAngle 52
ParachuteIconScale 1.25
ParachuteIconOffsetY -4.5
ParachuteLabelScale 1.00
ParachuteLabelOffsetY 8.5
HighlightEquippedParachute TRUE
ParachuteHighlightOutlineWidth 0
GlyphRed   206
GlyphGreen 210
GlyphBlue  216
GlyphOutlineRed   0
GlyphOutlineGreen 0
GlyphOutlineBlue  0
GlyphOutlineAlpha 205
GlyphOutlineWidth 1.0

; --- Hub and panel ---
ShowHubEyebrow TRUE
HubTextEdge 0.65
HubShadowAlpha  0
HubShadowSpread 52
HubTextFollowsWheelScale TRUE
ShowHubPointer FALSE
DimAmmoClip TRUE

PanelRed   12
PanelGreen 12
PanelBlue  12
PanelOpacity 0.50
WeaponStatsAccentRule FALSE
PanelRimAlpha 0
WeaponStatsLayout    Stacked
WeaponStatsRowHeight 24
WeaponStatsLabelGap  2
WeaponStatsWidth     168
WeaponStatsBarHeight 5
WeaponStatsPadX      10
WeaponStatsPadY      9
WeaponStatsTitleCase TRUE
StatLabelUsesBarColour TRUE
StatTrackRed   120
StatTrackGreen 120
StatTrackBlue  124
StatBarRed   238
StatBarGreen 242
StatBarBlue  246

TintAlpha 70
