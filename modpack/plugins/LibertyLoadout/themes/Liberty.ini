; Liberty - the default look, every style key at its shipped value.
;
; LibertyLoadout.ini ships with "Theme Liberty", so this is the file you see
; in-game. Full key list, ranges and allowed values: README.txt in this folder.
;
; Copy this file, rename it, and point Theme at the copy to keep your version
; safe from an update. Keys you delete fall back to these same values.
;
; Leave Theme blank in LibertyLoadout.ini to ignore this file and read styling
; from LibertyLoadout.ini instead (the 0.8.0 path).
;
; The ring is nine detached tiles with cut corners rather than one continuous
; donut: the gap does the separating, so there are no seams and no rim, and the
; wheel shadow is off because a disc that reaches the outer radius fills every
; gap from behind. HubShadow does that job instead, confined to the hub.

; --- Ring ---
; WheelScale is the shared fallback. WeaponWheelScale 0.50-1.75, Radio 0.50-1.90.
WheelScale       1.00
WeaponWheelScale 1.00
RadioWheelScale  1.00
CenterTextScale  1.50
HubTextFollowsWheelScale FALSE

; Top or Bottom. Bottom puts slot zero at six o'clock.
WeaponUnarmedPosition Top
RadioOffPosition      Top

WedgeRed   24
WedgeGreen 28
WedgeBlue  34
WedgeOpacity 0.62
WedgeGradient 1.00

RimRed   208
RimGreen 218
RimBlue  230
RimAlpha  0
SeamRed   208
SeamGreen 218
SeamBlue  230
SeamAlpha 0

WedgeOutlineRed   208
WedgeOutlineGreen 218
WedgeOutlineBlue  230
WedgeOutlineOuterAlpha 0
WedgeOutlineInnerAlpha 0
WedgeOutlineSideAlpha  0
WedgeOutlineWidth 1.00
WedgeOutlineUsesAccent FALSE

WheelOuterRadius 182
WheelInnerRadius 104
; Half the gap, in degrees. The shared key backs the two per-wheel ones; the
; radio ring takes a smaller gap because a page can hold far more wedges.
WheelSegmentGap       3.20
WeaponWheelSegmentGap 3.20
RadioWheelSegmentGap  1.60
; Round or Chamfer. Chamfer is the antialiasing-safe choice on a small ring.
WedgeCornerRadius 7
WedgeCornerStyle  Round
WheelHairline    1.00
WeaponIconSize   24
; HD | Color | Original | OriginalUpscaled (Liberty ships OriginalUpscaled)
WeaponIcons      OriginalUpscaled
RadioIconSize    22
ParachuteBadgeRadius 25
ParachuteBadgeGap 14
ParachuteBadgeAngle 48
ParachuteIconScale 1.25
ParachuteIconOffsetY -4.5
ParachuteLabelScale 1.00
ParachuteLabelOffsetY 8.5
HighlightEquippedParachute TRUE
ParachuteHighlightOutlineWidth 0
ParachuteBadgeRimAlpha 52
ParachuteBadgeRimWidth 1.00
StyleShortcutTextScale 1.00

WheelShadowAlpha  0
WheelShadowSpread 16
HubShadowAlpha  130
HubShadowSpread 34

; Faint ring outside the rim, with the accent over the selected wedge. Off:
; drawn at any real weight it reads as a second, unrelated ring sitting around
; the wheel rather than as part of it, and the tiles hold together without it.
; Raise the width to try it.
OuterTrackWidth 0
OuterTrackAlpha 46
OuterTrackGap   7

