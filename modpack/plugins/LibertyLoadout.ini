; Liberty Loadout 0.12.2 for GTA IV Complete Edition.
;
; This file sets how the wheels BEHAVE: what opens them, how long a hold takes,
; which features are on. How they LOOK - every colour, size, and shape - lives in
; a theme file instead, so the two never have to be told apart by guesswork.
;
; Every key here is shown at its shipped default. Deleting one changes nothing.

; --- Theme ---
; Names a file in plugins/LibertyLoadout/themes, without the .ini on the end.
; Every style key, range and allowed value is listed in
; plugins/LibertyLoadout/themes/README.txt.
;
; Liberty is the default, and that is the look you see in-game. Edit
; plugins/LibertyLoadout/themes/Liberty.ini to change colours, sizes, and
; shapes. A name with a typo in it, or a file you have deleted, leaves the
; default look alone and says so in the log.
;
; Shipped themes:
;   Liberty  - the default look, written out in full. This is the file to
;              edit, and the file to copy when writing your own
;   GTAV     - GTA V's feel: translucent grey wedges with the scene showing
;              through the gaps between them, a wash of blue on the wedge under
;              the cursor, no cursor arrow, and the fist at six o'clock. Each
;              episode keeps its own accent, as GTA V tints its wheel per
;              character: blue on GTA IV, red on TLAD, magenta on TBoGT
;
; A theme supplies the whole look. Keys it leaves out fall back to the shipped
; defaults, not to anything set here, so selecting one means "draw it this way"
; rather than "merge it with mine". To change one thing about a theme, edit its
; file, or copy it under a new name and point Theme at that.
;
; Leave Theme blank to read styling from THIS file instead, which is how every
; version through 0.8.0 worked. That is deliberate: it keeps an upgraded
; install drawing whatever you had customised, and it means changing one colour
; never requires touching a theme at all. Paste any key from themes/Liberty.ini
; below and it will apply. Set a Theme and those pasted keys stop being read.
Theme GTAV

; --- Shared wheel behavior and presentation ---
; These settings affect both the on-foot weapon wheel and in-vehicle radio wheel.
; How long the button must be held before the wheel takes over the controls.
; Lower values make a deliberate tap more likely to open the wheel instead of
; performing the game's own next-weapon or next-station action.
HoldThresholdMs 250
; Time scale while a wheel is open. SlowMotionScale is the shared fallback; the
; per-wheel keys below override it. The radio wheel defaults to a milder value
; on purpose: GTA IV's audio engine quietens with the time warp while the radio
; keeps playing in real time, so deep slow motion audibly ducks the music. It
; only follows SlowMotionScale where that is the milder of the two; raising
; RadioSlowMotionScale to 1.00 removes the slow motion, and the ducking with it.
; 0 leaves the game's own time scale alone.
SlowMotionScale       0.10
WeaponSlowMotionScale 0.10
RadioSlowMotionScale  0.50
; Bloom and retraction times in milliseconds. 0 makes that end a hard cut.
OpenDurationMs 110
CloseDurationMs 90
; Start the wheel from the moment the button goes down instead of waiting out
; HoldThresholdMs. Off by default: the opener doubles as the native next-weapon
; and next-station button, so a tap would flash a ring it never meant to open.
; Either way the cursor works as soon as the wheel is visible - the ring and the
; mouse capture start together. The time scale and camera lock always wait for
; the hold threshold, so a tap costs no slow-motion blip.
BloomOnPress FALSE
; How far past a wedge boundary the cursor must travel before the highlight
; moves, as a fraction of one wedge. Stops a cursor near a boundary from
; flipping between neighbours, which is what makes narrow wedges feel slippery.
; 0 restores the plain nearest-wedge behavior. Range: 0.00 to 0.45.
SelectionStickiness 0.15
; Keep the last highlighted wedge selected after the right stick returns to the
; hub. Applies to the controller path of both weapon and radio wheels.
LatchControllerSelection TRUE
; Multiply how fast the mouse moves the wheel cursor. Keyboard and mouse only;
; the right stick maps to the cursor directly. Range: 0.25 to 4.00.
CursorSpeed 1.00
; Allow session-only theme and weapon-icon switching while a wheel is visible.
; FALSE disables both shortcuts. Runtime choices never rewrite an INI and reset
; to Theme and WeaponIcons after GTA IV restarts.
EnableStyleShortcuts TRUE
; Cycle every .ini file found in plugins/LibertyLoadout/themes. 120 is Windows
; VK_F9; use 0 to disable theme cycling. An inline main-INI style remains in the
; cycle when the game started with Theme blank or missing.
ThemeCycleKey 120
; Cycle HD, Color, Original, and OriginalUpscaled on the weapon wheel. 121 is
; Windows VK_F10; use 0 to disable icon cycling. Changing theme restores that
; theme's own WeaponIcons choice.
WeaponIconsCycleKey 121
; Show the available style shortcuts for three seconds the first time each
; wheel opens during a process. FALSE shows text only after a shortcut is used.
ShowStyleShortcutHintOnFirstOpen FALSE
; --- Weapon wheel (on foot) ---
; FALSE leaves GTA IV's native weapon input unchanged.
EnableWeaponWheel TRUE
; Holdable keyboard-and-mouse input. 9 is Windows VK_TAB; use 0 to disable.
KeyboardWheelKey 9
; Controller button that opens the wheel. NextWeapon is GTA IV's own next-weapon
; control, D-pad Right by default, and a tap on it still cycles weapons the
; normal way.
;
; Naming a physical button instead gives the wheel that button outright: it
; opens the wheel and stops doing whatever the game had on it, so LB no longer
; takes cover. Accepted: NextWeapon, NextRadio, A (Cross), B (Circle), X
; (Square), Y (Triangle), LB (L1), RB (R1), LT (L2), RT (R2), L3, R3, Back,
; DPadUp, DPadDown, DPadLeft, DPadRight, None.
WeaponWheelControllerButton NextWeapon
; While the weapon wheel is open and a parachute is owned, this shortcut selects
; the parachute. 82 is Windows VK_R; use 0 to disable the keyboard shortcut.
; The badge shows this key on a keyboard-opened wheel.
ParachuteShortcutKey 70
; Physical controller button for the same shortcut. The badge shows this name on
; a controller-opened wheel. Accepted: A (Cross), B (Circle), X (Square), Y
; (Triangle), LB (L1), RB (R1), LT (L2), RT (R2), L3, R3, Back, DPadUp,
; DPadDown, DPadLeft, DPadRight, None. A button that also opens the weapon wheel
; is disabled as a shortcut because it cannot be pressed independently.
;
; The shipped B binding and its Reload action are suppressed through release.
; Other controller bindings use GTA IV's stock action map on a best-effort basis.
; A custom keyboard key cannot be matched back to every remapped game action.
ParachuteShortcutControllerButton B
; FALSE keeps the wheel open so the equipped highlight is visible; release the
; opener to close normally. TRUE closes it as soon as the shortcut is pressed.
ParachuteShortcutClosesWheel FALSE
; Controller hold-versus-tap handling for the on-foot Next Weapon control.
; Ignored unless WeaponWheelControllerButton is NextWeapon: a wheel on its own
; button has no tap to tell apart.
EnableNextWeaponInterceptor TRUE
; Apply a weapon picked while looking through a sniper scope by dropping the
; scope, instead of holding the selection until aim is released. FALSE restores
; the wait.
ForceSniperScopeExit TRUE
; Drop the categories you are carrying nothing in, instead of drawing them as
; empty wedges. Unarmed always stays on the ring, and the ring never falls below
; four wedges - below that it stops looking like a ring at all. New in 0.8.0.
;
; Off by default, unlike the radio wheel's RadioAutoFitWedges, because the two
; are not the same trade. A station is always on the radio ring, so auto-fit only
; changes how wide its wedge is; a weapon category comes and goes as you pick
; things up, so with this on your pistol is not at the same angle from one hour
; of play to the next. Tidier ring, less muscle memory - pick whichever you value.
WeaponAutoFitWedges FALSE
; GTA V-style Damage / Fire Rate / Accuracy / Range panel shown while the weapon
; wheel is open. Values come from the game's live CWeaponInfo table, including
; modded WeaponInfo.xml. Which corner it sits in is part of the look, so it is
; WeaponStatsPosition in the theme.
; Hovering a different weapon than the equipped one shows green gain / red
; loss tips on each bar.
ShowWeaponStats TRUE
; --- Radio wheel (in vehicle) ---
; FALSE leaves GTA IV's native radio input and station carousel unchanged.
EnableRadioWheel TRUE
; Holdable keyboard-and-mouse input. 9 is Windows VK_TAB; use 0 to disable.
RadioWheelKey 9
; Open the radio wheel by holding D-pad Right, matching the weapon wheel.
; A short tap still performs the game's normal one-station change.
EnableRadioControllerInput TRUE
; Controller button that opens the radio wheel. Same names as
; WeaponWheelControllerButton. NextRadio is the only value that leaves the
; native station carousel answering a tap, and the bumpers already page the
; wheel's own station list.
RadioWheelControllerButton NextRadio
; Stations per wheel page, and an upper bound rather than a fixed page size while
; RadioAutoFitWedges is on. Lower values give wider wedges and larger logos. Page
; with the shoulder buttons on a controller or the mouse wheel. Range: 6 to 32.
;
; 12 rather than 0.7.0's 20: Complete Edition carries twenty-three stations, so 20
; filled one page and left three rattling around on a second. 12 splits them
; nearly evenly instead.
RadioStationsPerPage 12
; Give each page exactly as many wedges as it has stations to fill, instead of the
; same number on every page. New in 0.8.0 and on by default.
;
; Without it, a station list that does not divide evenly ends on a page padded out
; with blank wedges - twenty-three stations at twelve per page left one blank, and
; at 0.7.0's default of twenty left seventeen. With it, the stations are spread as
; evenly as they divide and there are no blanks at all, unless a page would end up
; with fewer than six wedges, which is where the ring stops looking like a ring.
;
; The trade-off is that wedges are a degree or two wider on a shorter page, so a
; station can sit at a slightly different angle depending on which page it is on.
; FALSE restores the blank-padded pages.
RadioAutoFitWedges TRUE
; Let GTA IV's own station carousel answer a native next/prev station press,
; which the wheel never sees. It stays hidden while the wheel is open and for a
; station the wheel tuned. FALSE keeps it hidden at all times.
ShowNativeRadioCarousel TRUE
; Show the artist and title playing on the tuned station under its name in the
; hub. Read from GTA IV's own track data, so talk stations show nothing.
ShowRadioTrackNames TRUE
; Retune when the cursor stays on a station for this many real-time milliseconds.
; Slow motion does not stretch the delay. The station becomes audible while the
; wheel is open, then its artist and title can appear in the hub. 0 disables
; previews and tunes only when the wheel closes.
RadioPreviewDelayMs 1500
; Which of GTA IV's text files station and track names are read from, named by
; its filename in common/text: american, french, german, italian, japanese,
; russian, spanish. "auto" follows the Windows display language. The file is
; read directly because the game's own text lookup does not work on Complete
; Edition; if it is missing, station names fall back to a built-in English list
; and track names are not shown.
RadioTextLanguage auto
; --- Compatibility ---
; Keep FusionFix Raw Input and this patch enabled together for mouse control
; with a fixed camera. Disable this setting when FusionFix Raw Input is off.
EnableFusionFixRawInputPatch TRUE
; --- Diagnostics ---
; Development inventory overlay.
ShowDiagnosticOverlay FALSE
; Append process private memory, working set, and pagefile use to
; LibertyLoadout.log at this interval in milliseconds. Startup and render-thread
; snapshots also include Direct3D's available-texture-memory estimate. 0
; disables logging; positive values clamp to 1000-600000. VerboseLog must also
; be TRUE. The D3D value is only a driver estimate, so compare its direction
; rather than treating it as exact.
MemoryLogIntervalMs 0
; Log per-state-change lifecycle, inventory, and effects lines. Crash
; diagnostics and startup results are always logged regardless of this setting.
VerboseLog FALSE
